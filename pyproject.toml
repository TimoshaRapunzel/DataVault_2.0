[project]
name = "retail-vault"
version = "0.1.0"
description = "Data Vault 2.0 retail warehouse on Snowflake with dbt + Airflow"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow==2.10.3",
    "astronomer-cosmos[dbt-snowflake]==1.11.2",
    "dbt-core==1.7.10",
    "dbt-snowflake==1.7.0",
    "apache-airflow-providers-snowflake>=5.3.0",
    "apache-airflow-providers-common-sql>=1.14.0",
    "loguru==0.7.2",
    "apache-airflow-providers-telegram==4.3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airflow/dags", "airflow/plugins"]

# ---------------------------------------------------------------------------
# Ruff — Python linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["airflow"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
    
    # === Правила, добавленные по требованию аудитора ===
    "Q",   # flake8-quotes (проверка кавычек)
    "FA",  # flake8-future-annotations 
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie (микро-улучшения кода)
    "PT",  # flake8-pytest-style (стиль тестов)
]
ignore = [
    "S101",  # use of assert (acceptable in tests)
    "S105",  # hardcoded password (env-var pattern flags false positives)
    "B008",  # function call in default argument (airflow DAG pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["airflow"]

[tool.ruff.lint.per-file-ignores]
"airflow/dags/*.py" = ["N802", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# uv — fast package resolver (uv.lock is REQUIRED and COMMITTED)
# ---------------------------------------------------------------------------
[tool.uv]
index-url = "https://pypi.org/simple"