name: Retail Data Vault CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # 1. Строгое имя по ТЗ
  secrets-guard:
    name: "secrets-guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Строгое имя по ТЗ
  dbt-check:
    name: "dbt-check"
    needs: secrets-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install ruff pre-commit dbt-snowflake==1.7.0
      - name: Run Lint
        run: pre-commit run --all-files
      - name: dbt Compile
        run: |
          cd dbt_core
          dbt deps
          dbt compile --target dev
        env:
          SNOWFLAKE_ACCOUNT: "test"
          SNOWFLAKE_USER: "test"
          SNOWFLAKE_PASSWORD: "test"
          SNOWFLAKE_ROLE: "test"
          SNOWFLAKE_DATABASE: "test"
          SNOWFLAKE_WAREHOUSE: "test"
          SNOWFLAKE_SCHEMA: "test"
