[project]
name = "retail-vault"
version = "0.1.0"
description = "Data Vault 2.0 retail warehouse on Snowflake with dbt + Airflow"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow==2.10.3",
    "astronomer-cosmos[dbt-snowflake]==1.11.2",
    "dbt-core==1.7.10",
    "dbt-snowflake==1.7.0",
    "apache-airflow-providers-snowflake>=5.3.0",
    "apache-airflow-providers-common-sql>=1.14.0",
    "loguru==0.7.2",
    "apache-airflow-providers-telegram==4.3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
# Включаем preview, чтобы работали правила группы FURB по требованию ТЗ
preview = true
src = ["airflow"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "S", "B", "C4", "SIM", "TID", "RUF",
    "Q", "FA", "ISC", "PIE", "PT",
    # === Новые правила по требованию аудита ===
    "W",    # pycodestyle warnings
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "BLE",  # flake8-blind-except
    "FURB", # refurb (modernizing python code)
]
ignore = [
    "S101",
    "S105",
    "B008",
    "ISC001" # Рекомендуется отключать при использовании ruff-format
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
index-url = "https://pypi.org/simple"
